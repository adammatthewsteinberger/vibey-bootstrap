# Builds the MkDocs Material site and publishes it to GitHub Pages.
#
# Sources of truth are the repo-root markdown files and the package docstrings;
# docs/gen_pages.py assembles them at build time. Nothing is committed.
#
# NOTE: the two `paths:` lists below are intentionally duplicated rather than
# shared via a YAML anchor — GitHub Actions does not reliably support
# anchors/aliases in workflow files. Keep them in sync.

name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "mkdocs.yml"
      - "docs/**"
      - "vibey_bootstrap/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "**.md"
      - "mkdocs.yml"
      - "docs/**"
      - "vibey_bootstrap/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Never cancel a deploy to Pages; do cancel superseded PR previews.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install docs + all runtime extras
        # `all` is required so griffe can statically resolve the optional
        # third-party imports in transports/, scheduler/, sb_lock/, etc.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs,all]"

      - name: Build site
        run: mkdocs build --strict --verbose

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Upload PR preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs-site-preview
          path: site
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
